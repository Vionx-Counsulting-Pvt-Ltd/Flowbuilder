openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: FlowBuilder workflow, request, team, and reporting API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: workspace
  - name: workflows
  - name: requests
  - name: team
  - name: reports
  - name: storage
  - name: platform
paths:
  /reference-tables:
    get:
      operationId: listReferenceTables
      tags: [workspace]
      summary: List reusable tables in the current workspace
      responses:
        "200":
          description: Tables
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ReferenceTable" }
    post:
      operationId: createReferenceTable
      tags: [workspace]
      summary: Create a custom-column table
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReferenceTableInput" }
      responses:
        "201":
          description: Created table
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceTableDetail" }
  /reference-tables/{tableId}:
    parameters:
      - name: tableId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getReferenceTable
      tags: [workspace]
      summary: Read table columns and rows
      responses:
        "200":
          description: Table details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceTableDetail" }
    patch:
      operationId: updateReferenceTable
      tags: [workspace]
      summary: Update table structure
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReferenceTableInput" }
      responses:
        "200":
          description: Updated table
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceTableDetail" }
    delete:
      operationId: deleteReferenceTable
      tags: [workspace]
      summary: Delete an unlinked table
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceDeleteResult" }
  /reference-tables/{tableId}/rows:
    parameters:
      - name: tableId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: addReferenceRows
      tags: [workspace]
      summary: Append rows atomically, including bulk imports
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReferenceRowsInput" }
      responses:
        "201":
          description: Updated table
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceTableDetail" }
  /reference-tables/{tableId}/rows/{rowId}:
    parameters:
      - name: tableId
        in: path
        required: true
        schema: { type: string }
      - name: rowId
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateReferenceRow
      tags: [workspace]
      summary: Edit a row or change its availability in forms
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReferenceRowInput" }
      responses:
        "200":
          description: Updated table
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceTableDetail" }
    delete:
      operationId: deleteReferenceRow
      tags: [workspace]
      summary: Delete one row
      responses:
        "200":
          description: Updated table
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceTableDetail" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getCurrentUser
      tags: [workspace]
      summary: Get the signed-in member and workspace
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [workspace]
      summary: Get tasks, counts, workflows, and recent activity for the dashboard
      responses:
        "200":
          description: Dashboard overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /workflows:
    get:
      operationId: listWorkflows
      tags: [workflows]
      summary: List workflows available in the current workspace
      responses:
        "200":
          description: Workflow definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workflow"
    post:
      operationId: createWorkflow
      tags: [workflows]
      summary: Create a workflow definition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowInput"
      responses:
        "201":
          description: Created workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
  /workflows/{workflowId}:
    parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getWorkflow
      tags: [workflows]
      summary: Get one workflow definition
      responses:
        "200":
          description: Workflow definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "404":
          description: Workflow not found
    patch:
      operationId: updateWorkflow
      tags: [workflows]
      summary: Update or change the publication status of a workflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowUpdate"
      responses:
        "200":
          description: Updated workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
  /requests:
    get:
      operationId: listRequests
      tags: [requests]
      summary: List requests visible to the current member
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/RequestStatus"
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RequestSummary"
    post:
      operationId: createRequest
      tags: [requests]
      summary: Submit a request to a published workflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestInput"
      responses:
        "201":
          description: Submitted request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestDetail"
  /requests/{requestId}:
    parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getRequest
      tags: [requests]
      summary: Get a request, its progress, and audit trail
      responses:
        "200":
          description: Request detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestDetail"
        "404":
          description: Request not found
  /requests/{requestId}/actions:
    post:
      operationId: actOnRequest
      tags: [requests]
      summary: Approve, reject, or clarify a request
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestActionInput"
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestDetail"
  /users:
    get:
      operationId: listUsers
      tags: [team]
      summary: List workspace members
      responses:
        "200":
          description: Workspace members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceUser"
    post:
      operationId: createUser
      tags: [team]
      summary: Add a member to the workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Added member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceUser"
  /people:
    get:
      operationId: listPeople
      tags: [team]
      summary: List active workspace people for workflow fields
      responses:
        "200":
          description: Active workspace people
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PersonOption"
  /users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateUser
      tags: [team]
      summary: Update a member's role or active status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceUser"
  /roles:
    get:
      operationId: listRoles
      tags: [team]
      summary: List workspace roles and permissions
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceRole"
    post:
      operationId: createRole
      tags: [team]
      summary: Create a role with workflow permissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleInput"
      responses:
        "201":
          description: Created role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceRole"
  /roles/{roleId}:
    parameters:
      - name: roleId
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateRole
      tags: [team]
      summary: Update a role's name or permissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleUpdate"
      responses:
        "200":
          description: Updated role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceRole"
  /notifications:
    get:
      operationId: listNotifications
      tags: [workspace]
      summary: List notifications for the current member
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
  /notifications/{notificationId}/read:
    patch:
      operationId: markNotificationRead
      tags: [workspace]
      summary: Mark a notification as read
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
  /reports/overview:
    get:
      operationId: getReportOverview
      tags: [reports]
      summary: Get request volume, turnaround, and approver workload
      responses:
        "200":
          description: Reporting overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportOverview"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a private file upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
  /storage/objects/{fileId}:
    get:
      operationId: getStorageObject
      tags: [storage]
      summary: Download a private workspace file
      parameters:
        - name: fileId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Private file contents
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /platform/tenants:
    get:
      operationId: listPlatformTenants
      tags: [platform]
      summary: List tenant usage for platform administrators
      responses:
        "200":
          description: Tenant usage
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PlatformTenant" }
        "403": { description: Platform administrator access required }
    post:
      operationId: createPlatformTenant
      tags: [platform]
      summary: Provision a tenant and invite its first company admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformTenantInput" }
      responses:
        "201":
          description: Tenant provisioned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformTenant" }
  /platform/tenants/{tenantId}:
    patch:
      operationId: updatePlatformTenant
      tags: [platform]
      summary: Update tenant plan, limits, and white-label settings
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformTenantUpdate" }
      responses:
        "200":
          description: Updated tenant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformTenant" }
        "403": { description: Platform administrator access required }
components:
  schemas:
    ReferenceColumn:
      type: object
      required: [key, label, type, required]
      properties:
        key: { type: string, minLength: 1, maxLength: 50, pattern: "^[a-zA-Z][a-zA-Z0-9_]*$" }
        label: { type: string, minLength: 1, maxLength: 100 }
        type: { type: string, enum: [text, number, date, boolean] }
        required: { type: boolean }
    ReferenceValues:
      type: object
      additionalProperties:
        oneOf:
          - { type: string }
          - { type: number }
          - { type: boolean }
          - { type: "null" }
    ReferenceTableInput:
      type: object
      required: [name, description, columns]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        description: { type: string, maxLength: 1000 }
        columns:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/ReferenceColumn" }
    ReferenceTable:
      type: object
      required: [id, name, description, columns, rowCount, activeRowCount, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        columns:
          type: array
          items: { $ref: "#/components/schemas/ReferenceColumn" }
        rowCount: { type: integer }
        activeRowCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ReferenceTableDetail:
      allOf:
        - $ref: "#/components/schemas/ReferenceTable"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items: { $ref: "#/components/schemas/ReferenceRow" }
    ReferenceRow:
      type: object
      required: [id, values, active]
      properties:
        id: { type: string }
        values: { $ref: "#/components/schemas/ReferenceValues" }
        active: { type: boolean }
    ReferenceRowInput:
      type: object
      required: [values]
      properties:
        values: { $ref: "#/components/schemas/ReferenceValues" }
        active: { type: boolean, default: true }
    ReferenceRowsInput:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          minItems: 1
          maxItems: 5000
          items: { $ref: "#/components/schemas/ReferenceRowInput" }
    ReferenceDeleteResult:
      type: object
      required: [deleted]
      properties:
        deleted: { type: boolean }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
    RequestStatus:
      type: string
      enum: [submitted, pending_approval, needs_clarification, approved, rejected, completed]
    WorkflowStatus:
      type: string
      enum: [draft, active, inactive]
    RoutingType:
      type: string
      enum: [sequential, parallel, conditional]
    WorkflowField:
      type: object
      required: [id, label, type, required]
      properties:
        id: { type: string }
        label: { type: string }
        type: { type: string, enum: [text, textarea, longtext, name, email, phone, url, address, number, decimal, percent, price, date, time, datetime, duration, select, enum, multiselect, enumlist, checkbox, yesno, radio, progress, ref, file, image, thumbnail, drawing, signature, video, people, lookup, color, latlong, location, xy, show] }
        required: { type: boolean }
        placeholder: { type: ["string", "null"] }
        options:
          type: array
          items: { type: string }
        sourceTableId: { type: ["string", "null"] }
        sourceLabelColumn: { type: ["string", "null"] }
        optionLabels:
          type: object
          additionalProperties: { type: string }
        key: { type: ["string", "null"] }
        helpText: { type: ["string", "null"] }
        readOnly: { type: boolean }
        hidden: { type: boolean }
        defaultValue: { type: ["string", "null"] }
        initialValueExpression: { type: ["string", "null"] }
        appFormula: { type: ["string", "null"] }
        showIf: { type: ["string", "null"] }
        requiredIf: { type: ["string", "null"] }
        validIf: { type: ["string", "null"] }
        invalidMessage: { type: ["string", "null"] }
        width: { type: integer, minimum: 1, maximum: 6 }
        prefix: { type: ["string", "null"] }
        suffix: { type: ["string", "null"] }
        min: { type: ["number", "null"] }
        max: { type: ["number", "null"] }
        minLength: { type: ["integer", "null"], minimum: 0 }
        maxLength: { type: ["integer", "null"], minimum: 0 }
        multiple: { type: boolean }
        accept: { type: ["string", "null"] }
        maxFiles: { type: integer, minimum: 1, maximum: 10 }
        maxFileSizeMB: { type: integer, minimum: 1, maximum: 25 }
        displayCondition:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/FieldCondition"
    FieldCondition:
      type: object
      required: [fieldId, operator, value]
      properties:
        fieldId: { type: string }
        operator: { type: string, enum: [equals, notEquals, contains] }
        value: { type: string }
    WorkflowStage:
      type: object
      required: [id, name, order, assigneeType, assigneeLabel, slaHours]
      properties:
        id: { type: string }
        name: { type: string }
        order: { type: integer }
        assigneeType: { type: string, enum: [role, user, manager] }
        assigneeId: { type: ["string", "null"] }
        assigneeLabel: { type: string }
        slaHours: { type: integer, minimum: 1 }
        conditionFieldId: { type: ["string", "null"] }
        conditionValue: { type: ["string", "null"] }
    Workflow:
      type: object
      required: [id, name, category, description, status, version, routing, fields, stages, ownerUserId, ownerName, requestCount, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/WorkflowStatus" }
        version: { type: integer }
        routing: { $ref: "#/components/schemas/RoutingType" }
        fields:
          type: array
          items: { $ref: "#/components/schemas/WorkflowField" }
        stages:
          type: array
          items: { $ref: "#/components/schemas/WorkflowStage" }
        ownerUserId: { type: string }
        ownerName: { type: string }
        requestCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WorkflowInput:
      type: object
      required: [name, category, description, routing, fields, stages]
      properties:
        name: { type: string, minLength: 2 }
        category: { type: string }
        description: { type: string }
        routing: { $ref: "#/components/schemas/RoutingType" }
        fields:
          type: array
          items: { $ref: "#/components/schemas/WorkflowField" }
        stages:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/WorkflowStage" }
    WorkflowUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        category: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/WorkflowStatus" }
        routing: { $ref: "#/components/schemas/RoutingType" }
        fields:
          type: array
          items: { $ref: "#/components/schemas/WorkflowField" }
        stages:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/WorkflowStage" }
    RequestSummary:
      type: object
      required: [id, requestCode, workflowId, workflowName, requesterId, requesterName, status, currentStage, currentStageName, totalStages, dueAt, createdAt, updatedAt]
      properties:
        id: { type: integer }
        requestCode: { type: string }
        workflowId: { type: string }
        workflowName: { type: string }
        requesterId: { type: string }
        requesterName: { type: string }
        status: { $ref: "#/components/schemas/RequestStatus" }
        currentStage: { type: integer }
        currentStageName: { type: string }
        totalStages: { type: integer }
        dueAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AuditEvent:
      type: object
      required: [id, actorName, action, comment, createdAt]
      properties:
        id: { type: integer }
        actorName: { type: string }
        action: { type: string }
        comment: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    RequestDetail:
      allOf:
        - $ref: "#/components/schemas/RequestSummary"
        - type: object
          required: [formData, fields, stages, audit]
          properties:
            formData:
              type: object
              additionalProperties: true
            fields:
              type: array
              items: { $ref: "#/components/schemas/WorkflowField" }
            stages:
              type: array
              items: { $ref: "#/components/schemas/WorkflowStage" }
            audit:
              type: array
              items: { $ref: "#/components/schemas/AuditEvent" }
    RequestInput:
      type: object
      required: [workflowId, formData]
      properties:
        workflowId: { type: string }
        formData:
          type: object
          additionalProperties: true
    RequestActionInput:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [approve, reject, request_clarification, respond_clarification] }
        comment: { type: ["string", "null"] }
    CurrentUser:
      type: object
      required: [id, name, email, roleId, roleName, tenantId, tenantName, permissions, isPlatformAdmin, branding]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        roleId: { type: string }
        roleName: { type: string }
        tenantId: { type: string }
        tenantName: { type: string }
        permissions:
          type: array
          items: { type: string }
        isPlatformAdmin: { type: boolean }
        branding: { $ref: "#/components/schemas/TenantBranding" }
    TenantBranding:
      type: object
      required: [logoUrl, primaryColor, customDomain]
      properties:
        logoUrl: { type: ["string", "null"] }
        primaryColor: { type: ["string", "null"] }
        customDomain: { type: ["string", "null"] }
    PlatformPlan:
      type: string
      enum: [starter, professional, enterprise]
    PlatformTenant:
      type: object
      required: [id, name, plan, memberLimit, requestLimit, memberCount, requestCount, branding, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        plan: { $ref: "#/components/schemas/PlatformPlan" }
        memberLimit: { type: integer }
        requestLimit: { type: integer }
        memberCount: { type: integer }
        requestCount: { type: integer }
        branding: { $ref: "#/components/schemas/TenantBranding" }
        createdAt: { type: string, format: date-time }
    PlatformTenantInput:
      type: object
      required: [name, adminName, adminEmail, plan, memberLimit, requestLimit]
      properties:
        name: { type: string, minLength: 2 }
        adminName: { type: string, minLength: 2 }
        adminEmail: { type: string, format: email }
